services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shopify_scraper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopify_scraper"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql://neondb_owner:npg_AnN8Ebd7upSC@ep-weathered-star-ay82lbbz.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require
      SCRAPER_ALLOWED_ORIGINS: '["https://fitler-test.ibra-so-sow.workers.dev/scraper"]'
      SCRAPER_AUTO_CREATE_TABLES: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
