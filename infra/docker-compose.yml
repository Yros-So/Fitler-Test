services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shopify_scraper
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shopify_scraper"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
    environment:
      SCRAPER_DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/shopify_scraper
      SCRAPER_ALLOWED_ORIGINS: '["http://localhost:3000"]'
      SCRAPER_AUTO_CREATE_TABLES: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
